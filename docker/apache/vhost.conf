ServerName localhost

DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /index.php
</Directory>

# Application core: .env, vendor/, src/, config/, migrations/, composer.*, tests/ - never served directly
<Directory "/var/www/html/cms">
    Require all denied
</Directory>

# Runtime cache/logs - never served
<Directory "/var/www/html/var">
    Require all denied
</Directory>

# Template/plugin source (raw JSX/SCSS/Twig) - only the compiled output under /build is public
<Directory "/var/www/html/template">
    Require all denied
</Directory>
<Directory "/var/www/html/plugin">
    Require all denied
</Directory>

# Build tooling / infra config staying at repo root - not meant to be public
<Directory "/var/www/html/docker">
    Require all denied
</Directory>
<Directory "/var/www/html/node_modules">
    Require all denied
</Directory>
<FilesMatch "^(package(-lock)?\.json|webpack\.config\.js|compose(\.override)?\.yaml|Makefile|\.gitignore|\.editorconfig|README\.md|CLAUDE\.md)$">
    Require all denied
</FilesMatch>

# Compiled frontend assets (webpack output) - explicit exception to the cms/ deny above
Alias /build "/var/www/html/cms/public/build"
<Directory "/var/www/html/cms/public/build">
    Require all granted
</Directory>

# Symfony dev-tool assets (web-profiler/debug-bundle), copied there by `assets:install`
Alias /bundles "/var/www/html/cms/public/bundles"
<Directory "/var/www/html/cms/public/bundles">
    Require all granted
</Directory>

# User uploads: publicly readable, but never executed as PHP
<Directory "/var/www/html/upload">
    Require all granted
    <FilesMatch \.php$>
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>
