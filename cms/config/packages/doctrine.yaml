doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            PluginPage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../plugin/page/src/Entity'
                prefix: 'Plugin\Page\Entity'
                alias: PluginPage
            PluginI18n:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../plugin/i18n/src/Entity'
                prefix: 'Plugin\I18n\Entity'
                alias: PluginI18n
            PluginPortfolio:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../plugin/portfolio/src/Entity'
                prefix: 'Plugin\Portfolio\Entity'
                alias: PluginPortfolio
            PluginNews:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../plugin/news/src/Entity'
                prefix: 'Plugin\News\Entity'
                alias: PluginNews
            PluginHomepage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../plugin/homepage/src/Entity'
                prefix: 'Plugin\Homepage\Entity'
                alias: PluginHomepage
            PluginNewsletter:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../plugin/newsletter/src/Entity'
                prefix: 'Plugin\Newsletter\Entity'
                alias: PluginNewsletter

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
