doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
        # Page and i18n moved into the core (step 52): namespaces kept as-is so
        # already-applied migration versions stay recognized, only the physical
        # directory changed (was plugin/page|i18n/migrations).
        'Plugin\Page\Migrations': '%kernel.project_dir%/migrations/Page'
        'Plugin\I18n\Migrations': '%kernel.project_dir%/migrations/I18n'
        'Plugin\Portfolio\Migrations': '%kernel.project_dir%/../plugin/portfolio/migrations'
        'Plugin\News\Migrations': '%kernel.project_dir%/../plugin/news/migrations'
        'Plugin\Homepage\Migrations': '%kernel.project_dir%/../plugin/homepage/migrations'
        'Plugin\Newsletter\Migrations': '%kernel.project_dir%/../plugin/newsletter/migrations'
        'Plugin\Stats\Migrations': '%kernel.project_dir%/../plugin/stats/migrations'
    enable_profiler: false
    # MySQL DDL implicitly commits, so wrapping each migration in an explicit
    # transaction just triggers a deprecated "already committed" silencing path.
    all_or_nothing: false
